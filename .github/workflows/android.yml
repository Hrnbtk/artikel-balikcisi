# Android Studio kurmadan Google Play paketi (.aab) üretir.
# Kullanım: bu klasörü bir GitHub deposuna koy, Actions sekmesinden "Android paketi" > Run workflow.
# İmzalı paket için depo Settings > Secrets bölümüne şunları ekle:
#   ANDROID_KEYSTORE_BASE64 (keystore dosyasının base64 hali), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android paketi
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Keystore
        env: { KS_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/release.keystore; fi
      - name: AAB üret
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            chmod +x gradlew; ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            chmod +x gradlew; ./gradlew bundleRelease assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: artikel-balikcisi-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
